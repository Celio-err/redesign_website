{% extends 'master/base.html' %}
{% block page_title %}Excluir Tipo de Mandato{% endblock %}
{% block content %}

<div class="container-fluid">
    <div class="col-md-12">
        <div class="white_shd full margin_bottom_30">

            <div class="full graph_head">
                <div class="heading1 margin_0">
                    <h2>Confirmar Exclusão</h2>
                </div>
            </div>

            <div class="padding_infor_info">

                <p>
                    Tens certeza que queres excluir o tipo de mandato
                    <strong>"{{ tipo.tipo_mandato }}"</strong>?
                    Esta ação não pode ser desfeita.
                </p>

                <form method="post">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        <i class="fa fa-trash"></i> Sim, Excluir
                    </button>

                    <a href="{% url 'tipo_mandato_list' %}" class="btn btn-secondary">
                        <i class="fa fa-arrow-left"></i> Cancelar
                    </a>
                </form>

            </div>

        </div>
    </div>

</div>

{% endblock %}
