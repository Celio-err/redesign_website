{% extends 'master/base.html' %}
{% block page_title %}Detalhes da Função{% endblock %}
{% block content %}

<div class="container-fluid">
    <div class="col-md-12">
        <div class="white_shd full margin_bottom_30" style="border-radius: 12px; overflow: hidden;">

            <div class="full graph_head" style="background: linear-gradient(135deg, #0c253f 0%, #0c253f 100%); padding: 25px;">
                <div style="color: #fff; font-weight: 600; font-size: 18px;">
                    <i class="fa fa-briefcase"></i> Detalhes da Função
                </div>
            </div>

            <div class="padding_infor_info" style="padding: 30px;">

                <div style="border-left: 3px solid #4facfe; padding-left: 15px;">
                    <label style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #999; font-weight: 600; display: block; margin-bottom: 5px;">
                        <i class="fa fa-briefcase"></i> Função
                    </label>
                    <p style="font-size: 16px; margin: 0; color: #2d3436;">{{ funcao.funcao_mandato }}</p>
                </div>

                <hr style="margin: 25px 0;">

                <a href="{% url 'funcao_mandato_update' funcao.pk %}" class="btn" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: #fff; padding: 10px 22px; border-radius: 8px; font-weight: 600;">
                    <i class="fa fa-edit"></i> Editar
                </a>

                <a href="{% url 'funcao_mandato_list' %}" class="btn btn-secondary" style="padding: 10px 22px; border-radius: 8px; font-weight: 600;">
                    <i class="fa fa-arrow-left"></i> Voltar
                </a>

            </div>

        </div>
    </div>

</div>

{% endblock %}
