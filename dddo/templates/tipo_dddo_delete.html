{% extends 'master/base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="row column_title">
        <div class="col-md-12">
            <div class="page_title">
                <h2>Excluir Tipo de DDDO</h2>
            </div>
        </div>
    </div>

    <div class="col-md-12">
        <div class="white_shd full margin_bottom_30" style="border-radius: 12px; overflow: hidden;">

            <div class="full graph_head" style="background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%); padding: 25px;">
                <div style="color: #fff; font-weight: 600; font-size: 18px;">
                    <i class="fa fa-exclamation-triangle"></i> Confirmar Exclusão
                </div>
            </div>

            <div class="padding_infor_info" style="padding: 30px;">

                <p style="font-size: 15px; color: #636e72;">
                    Tens certeza que queres excluir o tipo
                    <strong>"{{ tipo.tipo_dddo }}"</strong>?
                    Esta ação não pode ser desfeita.
                </p>

                <form method="post">
                    {% csrf_token %}

                    <button type="submit" class="btn" style="background: #e74c3c; color: #fff; padding: 10px 22px; border-radius: 8px; font-weight: 600; border: none;">
                        <i class="fa fa-trash"></i> Sim, Excluir
                    </button>

                    <a href="{% url 'tipo_dddo_detail' tipo.pk %}" class="btn btn-secondary" style="padding: 10px 22px; border-radius: 8px; font-weight: 600;">
                        <i class="fa fa-arrow-left"></i> Cancelar
                    </a>
                </form>

            </div>

        </div>
    </div>

</div>

{% endblock %}
