{% extends 'master/base.html' %}
{% block page_title %}Excluir notícia{% endblock %}
{% block content %}
<div class="container-fluid px-4 py-4">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4 text-center">
          <div class="mb-3" style="font-size:2.5rem; color:#dc3545;">
            <i class="fa fa-exclamation-triangle"></i>
          </div>
          <h2 class="h5 fw-semibold mb-2">Excluir notícia</h2>
          <p class="text-muted mb-4">
            Tens certeza que queres excluir <strong>"{{ noticia.nome_noticia }}"</strong>?
            Esta ação não pode ser desfeita.
          </p>
          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center">
              <button type="submit" class="btn btn-danger">
                <i class="fa fa-trash me-1"></i> Sim, excluir
              </button>
              <a href="{% url 'noticias_list' %}" class="btn btn-outline-secondary">
                <i class="fa fa-arrow-left me-1"></i> Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
